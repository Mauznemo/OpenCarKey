allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // The home_widget plugin depends on androidx.glance:glance-appwidget:1.+ (a floating
    // version range). That range can silently resolve to a new alpha release requiring a
    // newer compileSdk/AGP than this project uses, breaking the build without any change
    // on our side. Force it to the latest stable release everywhere, including plugin
    // subprojects like :home_widget.
    configurations.all {
        resolutionStrategy {
            force 'androidx.glance:glance-appwidget:1.1.1'
        }
    }
}

// home_widget (and its androidx.glance dependency) ship Kotlin bytecode built
// for JVM target 11. Flutter plugin modules still default their Kotlin target to
// 1.8, and the Kotlin inliner refuses to inline JVM 11 bytecode into a 1.8
// target (`:home_widget:compileReleaseKotlin` fails). Force every subproject's
// Kotlin target to 11 to match the app module.
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }
    // Keep Java in step with Kotlin (11); Gradle rejects a module whose Java and
    // Kotlin JVM targets disagree. Set it through the Android DSL so the Android
    // Gradle plugin doesn't reset the JavaCompile tasks back to the plugin
    // module's own compileOptions (1.8).
    afterEvaluate {
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
