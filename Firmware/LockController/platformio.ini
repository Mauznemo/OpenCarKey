; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; The tests run on the computer, see env:native
test_ignore = *

; Security tests for lib/OckCore (HMAC, rolling codes, message parsing, proximity key).
; Run them with: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
extra_scripts = test/sanitizer_link_flags.py
